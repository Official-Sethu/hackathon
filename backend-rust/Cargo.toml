[package]
name = "trace_backend"
version = "1.0.0"
edition = "2021"
authors = ["Trace Team <dev@trace.org>"]
description = "High-performance Axum backend routing multi-model AI fact checking through Gonka Router (gonkarouter.io)"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1.7", features = ["v4"] }
dotenvy = "0.15"
